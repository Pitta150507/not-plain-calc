<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Not Plain Calc design evolution</title><desc id="desc">A diagrammatic comparison of the first public code snapshot, the Macintosh Refined design, and the product recognition icon direction.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#242119" flood-opacity=".13"/></filter><style>.bg{fill:#F7F2E8}.phone{fill:#FFFDF8;stroke:#DDD5C7;stroke-width:3}.plate{fill:#F0ECE3;stroke:#DDD5C7;stroke-width:2}.screen{fill:#FDFBF6;stroke:#DDD5C7;stroke-width:2}.key{fill:#F8F5EE;stroke:#C5BAAA;stroke-width:2}.op{fill:#FBF8F0;stroke:#B9C9D9;stroke-width:2}.eq{fill:#C9623D}.oldaccent{fill:#D95700}.newblue{fill:#4F7198}.newgreen{fill:#5E8F72}.title{font:800 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.k{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5E8F72;letter-spacing:3px}.h{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.b{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#665F54}.num{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.white{fill:#fff}.note{fill:#FFF0E8;stroke:#C9623D;stroke-width:2}</style></defs>
  <rect class="bg" width="1700" height="980"/><text class="k" x="90" y="80">DESIGN EVOLUTION</text><text class="title" x="90" y="140">The identity moved from decoration to product structure</text>
  <text class="b" x="90" y="180">The left frame is a diagrammatic reconstruction from the first Git snapshot, not an archived screenshot.</text>
  <g filter="url(#s)">
    <rect class="phone" x="120" y="245" width="400" height="630" rx="50"/>
    <text class="h" x="155" y="300">First public snapshot</text><text class="b" x="155" y="330">Warm, soft, less ownable</text>
    <rect class="screen" x="155" y="365" width="330" height="145" rx="35"/><rect x="180" y="395" width="280" height="90" rx="30" fill="#FFF0DE"/><text class="num" x="435" y="467" text-anchor="end" style="font-size:78px">0</text>
    <g transform="translate(155 560)"><rect class="key" x="0" y="0" width="82" height="70" rx="25"/><rect class="key" x="92" y="0" width="82" height="70" rx="25"/><rect class="key" x="184" y="0" width="82" height="70" rx="25"/><rect x="276" y="0" width="54" height="70" rx="25" fill="#fff" stroke="#FFE0BF" stroke-width="2"/>
      <rect class="key" x="0" y="82" width="82" height="70" rx="25"/><rect class="key" x="92" y="82" width="82" height="70" rx="25"/><rect class="key" x="184" y="82" width="82" height="70" rx="25"/><rect x="276" y="82" width="54" height="70" rx="25" fill="#fff" stroke="#FFE0BF" stroke-width="2"/>
      <rect class="key" x="0" y="164" width="174" height="70" rx="25"/><rect class="key" x="184" y="164" width="82" height="70" rx="25"/><rect class="eq" x="276" y="164" width="54" height="70" rx="25"/></g>

    <rect class="phone" x="650" y="245" width="400" height="630" rx="38"/>
    <text class="h" x="685" y="300">Macintosh Refined</text><text class="b" x="685" y="330">Structured, tactile, recognizable</text>
    <rect class="screen" x="685" y="365" width="330" height="145" rx="22"/><rect class="newgreen" x="705" y="383" width="28" height="5" rx="3"/><rect x="742" y="383" width="14" height="5" rx="3" fill="#C5BAAA"/><rect x="765" y="383" width="14" height="5" rx="3" fill="#C5BAAA"/><rect x="705" y="414" width="290" height="78" rx="18" fill="#EDF5F0"/><text class="num" x="970" y="478" text-anchor="end" style="font-size:74px">0</text>
    <g transform="translate(685 550)"><rect class="plate" x="-10" y="-12" width="350" height="265" rx="24"/><rect class="key" x="0" y="0" width="82" height="70" rx="16"/><rect class="key" x="92" y="0" width="82" height="70" rx="16"/><rect class="key" x="184" y="0" width="82" height="70" rx="16"/><rect class="op" x="276" y="0" width="54" height="70" rx="16"/>
      <rect class="key" x="0" y="82" width="82" height="70" rx="16"/><rect class="key" x="92" y="82" width="82" height="70" rx="16"/><rect class="key" x="184" y="82" width="82" height="70" rx="16"/><rect class="op" x="276" y="82" width="54" height="70" rx="16"/>
      <rect class="key" x="0" y="164" width="174" height="70" rx="16"/><rect class="key" x="184" y="164" width="82" height="70" rx="16"/><rect class="eq" x="276" y="164" width="54" height="70" rx="16"/></g>

    <rect class="phone" x="1180" y="245" width="400" height="630" rx="80"/>
    <text class="h" x="1220" y="300">Product recognition icon</text><text class="b" x="1220" y="330">The interface became the mark</text>
    <rect class="screen" x="1240" y="385" width="280" height="155" rx="34"/><rect x="1270" y="415" width="220" height="95" rx="26" fill="#E9E4DA"/>
    <rect class="plate" x="1220" y="585" width="320" height="230" rx="45"/><rect class="key" x="1260" y="625" width="112" height="145" rx="36"/><rect class="eq" x="1392" y="625" width="112" height="145" rx="36"/><rect class="white" x="1422" y="680" width="52" height="12" rx="6"/><rect class="white" x="1422" y="710" width="52" height="12" rx="6"/>
  </g>
  <rect class="note" x="650" y="900" width="930" height="48" rx="18"/><text class="b" x="675" y="931">Decision: use historical interface principles, but no Apple logos, artwork, hardware silhouette, or copied calculator screen.</text>
</svg>
