<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" role="img" aria-labelledby="title desc">
  <title id="title">Not Plain Calc shipping pipeline</title><desc id="desc">A completed release pipeline from local quality and review through EAS signing, App Store Connect upload, and a public TestFlight beta.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#242119" flood-opacity=".1"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8C8578"/></marker><style>.bg{fill:#F7F2E8}.done{fill:#EDF5F0;stroke:#5E8F72;stroke-width:3}.ready{fill:#EDF2F7;stroke:#4F7198;stroke-width:3}.title{font:800 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.k{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5E8F72;letter-spacing:3px}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.b{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#665F54}.status{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}.g{fill:#5E8F72}.u{fill:#4F7198}.line{fill:none;stroke:#8C8578;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1700" height="930"/><text class="k" x="90" y="82">PRODUCT SHIPPING</text><text class="title" x="90" y="142">The release path is part of the engineering</text>
  <path class="line" d="M355 330H440"/><path class="line" d="M775 330H860"/><path class="line" d="M1195 330H1280"/><path class="line" d="M1445 445V535"/><path class="line" d="M1280 650H1195"/><path class="line" d="M860 650H775"/>
  <g filter="url(#s)">
    <rect class="done" x="90" y="235" width="265" height="190" rx="30"/><text class="status g" x="120" y="278">COMPLETE</text><text class="h" x="120" y="322">Local quality gate</text><text class="b" x="120" y="360">14 tests</text><text class="b" x="120" y="390">Strict TypeScript</text>
    <rect class="done" x="440" y="235" width="335" height="190" rx="30"/><text class="status g" x="470" y="278">COMPLETE</text><text class="h" x="470" y="322">Release review</text><text class="b" x="470" y="360">Security, privacy, IP,</text><text class="b" x="470" y="390">accessibility and dependencies</text>
    <rect class="done" x="860" y="235" width="335" height="190" rx="30"/><text class="status g" x="890" y="278">COMPLETE</text><text class="h" x="890" y="322">Public package</text><text class="b" x="890" y="360">GitHub, Pages, metadata,</text><text class="b" x="890" y="390">privacy and support URLs</text>
    <rect class="done" x="1280" y="235" width="330" height="210" rx="30"/><text class="status g" x="1310" y="278">COMPLETE</text><text class="h" x="1310" y="322">EAS signed build</text><text class="b" x="1310" y="360">Project linked</text><text class="b" x="1310" y="390">Device build completed</text><text class="b" x="1310" y="420">Export flag declared</text>
    <rect class="done" x="1280" y="535" width="330" height="230" rx="30"/><text class="status g" x="1310" y="578">RESOLVED</text><text class="h" x="1310" y="622">Apple credentials</text><text class="b" x="1310" y="660">Account owner completed 2FA.</text><text class="b" x="1310" y="690">Certificate and profile</text><text class="b" x="1310" y="720">created or validated.</text>
    <rect class="done" x="860" y="555" width="335" height="190" rx="30"/><text class="status g" x="890" y="598">COMPLETE</text><text class="h" x="890" y="642">App Store Connect</text><text class="b" x="890" y="680">App record created</text><text class="b" x="890" y="710">Signed binary uploaded</text>
    <rect class="ready" x="440" y="555" width="335" height="190" rx="30"/><text class="status u" x="470" y="598">LIVE</text><text class="h" x="470" y="642">Public TestFlight beta</text><text class="b" x="470" y="680">Build available to</text><text class="b" x="470" y="710">public beta testers</text>
  </g>
  <text class="b" x="90" y="850">Release status: public source, web assets, App Store Connect upload, and public TestFlight beta are live.</text>
</svg>
