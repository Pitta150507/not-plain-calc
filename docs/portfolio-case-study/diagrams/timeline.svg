<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860" role="img" aria-labelledby="title desc">
  <title id="title">Documented Not Plain Calc release timeline</title>
  <desc id="desc">Six public commits from June 8 through June 9, 2026, showing the release, redesign, audit, export configuration, public assets, and the TestFlight credential blocker.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#242119" flood-opacity=".10"/></filter><style>.bg{fill:#F7F2E8}.line{stroke:#C5BAAA;stroke-width:8;stroke-linecap:round}.dot{fill:#FDFBF6;stroke:#4F7198;stroke-width:8}.done{stroke:#5E8F72}.block{stroke:#C9623D}.card{fill:#FDFBF6;stroke:#DDD5C7;stroke-width:2}.title{font:800 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.k{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5E8F72;letter-spacing:3px}.date{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#4F7198}.h{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.b{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#665F54}</style></defs>
  <rect class="bg" width="1800" height="860"/><text class="k" x="90" y="80">DOCUMENTED RELEASE SPRINT</text><text class="title" x="90" y="140">Six commits, 32 hours, one honest blocker</text>
  <line class="line" x1="150" y1="430" x2="1650" y2="430"/>
  <g filter="url(#s)">
    <rect class="card" x="70" y="210" width="260" height="150" rx="24"/><text class="date" x="95" y="248">JUN 8  12:57</text><text class="h" x="95" y="286">v1.0 source release</text><text class="b" x="95" y="320">28 files enter Git</text>
    <rect class="card" x="350" y="500" width="280" height="170" rx="24"/><text class="date" x="375" y="538">JUN 8  14:01</text><text class="h" x="375" y="576">Macintosh Refined</text><text class="b" x="375" y="610">State machine, 14 tests,</text><text class="b" x="375" y="638">screenshots and EAS setup</text>
    <rect class="card" x="650" y="210" width="260" height="150" rx="24"/><text class="date" x="675" y="248">JUN 8  14:18</text><text class="h" x="675" y="286">Release audit</text><text class="b" x="675" y="320">Security, privacy, IP</text>
    <rect class="card" x="930" y="500" width="260" height="150" rx="24"/><text class="date" x="955" y="538">JUN 8  14:27</text><text class="h" x="955" y="576">Export compliance</text><text class="b" x="955" y="610">iOS encryption flag set</text>
    <rect class="card" x="1210" y="210" width="260" height="170" rx="24"/><text class="date" x="1235" y="248">JUN 9  02:23</text><text class="h" x="1235" y="286">Public release assets</text><text class="b" x="1235" y="320">Pages, icon study,</text><text class="b" x="1235" y="348">store metadata</text>
    <rect class="card" x="1490" y="500" width="260" height="170" rx="24"/><text class="date" x="1515" y="538">JUN 9  21:25</text><text class="h" x="1515" y="576">2FA blocker recorded</text><text class="b" x="1515" y="610">EAS reached Apple login.</text><text class="b" x="1515" y="638">No upload was claimed.</text>
  </g>
  <circle class="dot done" cx="200" cy="430" r="20"/><circle class="dot done" cx="490" cy="430" r="20"/><circle class="dot done" cx="780" cy="430" r="20"/><circle class="dot done" cx="1060" cy="430" r="20"/><circle class="dot done" cx="1340" cy="430" r="20"/><circle class="dot block" cx="1620" cy="430" r="20"/>
  <text class="b" x="90" y="790">Scope note: this timeline starts with the first public commit. Earlier design time was not retained in Git and is not estimated here.</text>
</svg>
