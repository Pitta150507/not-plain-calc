<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Not Plain Calc architecture</title>
  <desc id="desc">A layered diagram from Expo Router through interface components and shared services to the calculator state machine.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#242119" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4F7198"/></marker>
    <style>
      .bg{fill:#F7F2E8}.card{fill:#FDFBF6;stroke:#DDD5C7;stroke-width:2}.blue{fill:#EDF2F7;stroke:#4F7198}.green{fill:#EDF5F0;stroke:#5E8F72}.coral{fill:#FFF0E8;stroke:#C9623D}.label{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.body{font:500 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#665F54}.small{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#665F54}.title{font:800 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.kicker{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5E8F72;letter-spacing:3px}.line{fill:none;stroke:#4F7198;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="980"/>
  <text class="kicker" x="100" y="84">ENGINEERING MAP</text>
  <text class="title" x="100" y="142">A small app with explicit boundaries</text>
  <text class="body" x="100" y="183">Routing, presentation, feedback, tokens, and arithmetic can change independently.</text>

  <g filter="url(#shadow)">
    <rect class="card blue" x="570" y="240" width="460" height="110" rx="28"/>
    <text class="label" x="800" y="282" text-anchor="middle">Expo Router shell</text>
    <text class="small" x="800" y="319" text-anchor="middle">app/_layout.tsx  •  app/index.tsx</text>

    <rect class="card" x="120" y="450" width="330" height="150" rx="28"/>
    <text class="label" x="285" y="495" text-anchor="middle">Result display</text>
    <text class="body" x="285" y="532" text-anchor="middle">Expression, adaptive type,</text>
    <text class="body" x="285" y="562" text-anchor="middle">resolve animation, live region</text>

    <rect class="card" x="515" y="450" width="330" height="150" rx="28"/>
    <text class="label" x="680" y="495" text-anchor="middle">Numeric island</text>
    <text class="body" x="680" y="532" text-anchor="middle">Utility row, digits,</text>
    <text class="body" x="680" y="562" text-anchor="middle">zero and decimal</text>

    <rect class="card" x="910" y="450" width="330" height="150" rx="28"/>
    <text class="label" x="1075" y="495" text-anchor="middle">Operator rail</text>
    <text class="body" x="1075" y="532" text-anchor="middle">Active operation,</text>
    <text class="body" x="1075" y="562" text-anchor="middle">equals and visual thread</text>

    <rect class="card coral" x="1305" y="450" width="210" height="150" rx="28"/>
    <text class="label" x="1410" y="495" text-anchor="middle">CalcKey</text>
    <text class="body" x="1410" y="532" text-anchor="middle">Press state</text>
    <text class="body" x="1410" y="562" text-anchor="middle">and semantics</text>

    <rect class="card green" x="185" y="750" width="430" height="130" rx="28"/>
    <text class="label" x="400" y="797" text-anchor="middle">Calculator state machine</text>
    <text class="small" x="400" y="835" text-anchor="middle">pure transitions + formatter + arithmetic</text>

    <rect class="card blue" x="685" y="750" width="300" height="130" rx="28"/>
    <text class="label" x="835" y="797" text-anchor="middle">Design tokens</text>
    <text class="small" x="835" y="835" text-anchor="middle">color • type • spacing • motion</text>

    <rect class="card coral" x="1055" y="750" width="360" height="130" rx="28"/>
    <text class="label" x="1235" y="797" text-anchor="middle">Native feedback</text>
    <text class="small" x="1235" y="835" text-anchor="middle">Expo Haptics + Reanimated</text>
  </g>

  <path class="line" d="M800 350 V405 H285 V450"/>
  <path class="line" d="M800 350 V450"/>
  <path class="line" d="M800 405 H1075 V450"/>
  <path class="line" d="M1240 525 H1305"/>
  <path class="line" d="M680 600 V675 H400 V750"/>
  <path class="line" d="M1075 600 V675 H400 V750"/>
  <path class="line" d="M285 600 V705 H835 V750"/>
  <path class="line" d="M1410 600 V675 H1235 V750"/>
</svg>
