<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Spacing and typography system</title><desc id="desc">The spacing scale, radius scale, and adaptive result typography used by Not Plain Calc.</desc>
  <style>.bg{fill:#F7F2E8}.card{fill:#FDFBF6;stroke:#DDD5C7;stroke-width:2}.title{font:800 44px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.k{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5E8F72;letter-spacing:3px}.h{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1D1C18}.b{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#665F54}.mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#665F54}.bar{fill:#4F7198}.radius{fill:#EDF5F0;stroke:#5E8F72;stroke-width:2}.num{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;fill:#1D1C18}</style>
  <rect class="bg" width="1500" height="900"/><text class="k" x="80" y="80">SYSTEM, NOT MAGIC NUMBERS</text><text class="title" x="80" y="138">Rhythm and type scale</text>
  <rect class="card" x="80" y="205" width="640" height="590" rx="32"/><text class="h" x="120" y="255">Spacing tokens</text><text class="b" x="120" y="288">A 2, 4, 8 base with tuned 10 and 20 steps.</text>
  <g transform="translate(120 335)"><text class="mono" x="0" y="20">2</text><rect class="bar" x="80" y="5" width="20" height="20" rx="4"/><text class="mono" x="0" y="70">4</text><rect class="bar" x="80" y="55" width="40" height="20" rx="4"/><text class="mono" x="0" y="120">8</text><rect class="bar" x="80" y="105" width="80" height="20" rx="4"/><text class="mono" x="0" y="170">10</text><rect class="bar" x="80" y="155" width="100" height="20" rx="4"/><text class="mono" x="0" y="220">16</text><rect class="bar" x="80" y="205" width="160" height="20" rx="4"/><text class="mono" x="0" y="270">20</text><rect class="bar" x="80" y="255" width="200" height="20" rx="4"/><text class="mono" x="0" y="320">24</text><rect class="bar" x="80" y="305" width="240" height="20" rx="4"/><text class="mono" x="0" y="370">32</text><rect class="bar" x="80" y="355" width="320" height="20" rx="4"/></g>
  <text class="h" x="120" y="745">Corner radii</text><rect class="radius" x="310" y="710" width="70" height="55" rx="8"/><rect class="radius" x="400" y="710" width="70" height="55" rx="16"/><rect class="radius" x="490" y="710" width="70" height="55" rx="22"/><rect class="radius" x="580" y="710" width="70" height="55" rx="28"/>
  <rect class="card" x="780" y="205" width="640" height="590" rx="32"/><text class="h" x="820" y="255">Adaptive result typography</text><text class="b" x="820" y="288">Length selects a deterministic style before auto-fit.</text>
  <text class="num" x="820" y="415" style="font-size:94px">789</text><text class="mono" x="820" y="455">94 pt  •  1 to 3 visible digits</text>
  <text class="num" x="820" y="565" style="font-size:78px">12345678</text><text class="mono" x="820" y="605">78 pt  •  more than 7 digits</text>
  <text class="num" x="820" y="710" style="font-size:52px">1.23456e+12</text><text class="mono" x="820" y="750">52 pt  •  exponential or compact fallback</text>
</svg>
